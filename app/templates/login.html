<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sign in</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <main class="relative grid min-h-screen place-items-center overflow-hidden px-4 py-10">
      <div class="pointer-events-none absolute -left-40 -top-40 h-[32rem] w-[32rem] rounded-full bg-indigo-200/50 blur-3xl"></div>
      <div class="pointer-events-none absolute -bottom-48 -right-40 h-[36rem] w-[36rem] rounded-full bg-blue-200/50 blur-3xl"></div>

      <section class="relative w-full max-w-md rounded-3xl bg-white px-7 py-9 shadow-[0_24px_70px_rgba(79,70,229,0.16)] sm:px-12 sm:py-12">
        {% if error %}
        <div class="mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
          {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
          <input type="hidden" name="request_id" value="{{ request_id }}" />
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

          <div>
            <label for="email" class="mb-2 block text-sm font-medium text-slate-600">Email</label>
            <div class="relative">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex w-12 items-center justify-center text-slate-400" aria-hidden="true">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5v10.5H3.75z" /><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 7.5 7.5 6 7.5-6" /></svg>
              </span>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required class="h-14 w-full rounded-xl border border-slate-300 bg-white pl-12 pr-4 text-base text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" />
            </div>
          </div>

          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-slate-600">Password</label>
            <div class="relative">
              <span class="pointer-events-none absolute inset-y-0 left-0 flex w-12 items-center justify-center text-slate-400" aria-hidden="true">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2" /><path stroke-linecap="round" d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
              </span>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required class="h-14 w-full rounded-xl border border-slate-300 bg-white pl-12 pr-12 text-base text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" />
              <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 flex w-12 items-center justify-center text-slate-400 hover:text-slate-600" aria-label="Show password">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.75 12s3.25-5 9.25-5 9.25 5 9.25 5-3.25 5-9.25 5-9.25-5-9.25-5Z" /><circle cx="12" cy="12" r="2.25" /></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="h-14 w-full rounded-xl bg-indigo-500 text-base font-semibold text-white shadow-lg shadow-indigo-500/25 transition hover:bg-indigo-600 focus:outline-none focus:ring-4 focus:ring-indigo-200">Sign in</button>
        </form>

        <div class="my-7 flex items-center gap-4 text-sm text-slate-400">
          <span class="h-px flex-1 bg-slate-200"></span><span>or</span><span class="h-px flex-1 bg-slate-200"></span>
        </div>

        <a href="/login/google?request_id={{ request_id }}" class="flex h-14 w-full items-center justify-center gap-3 rounded-xl border border-slate-300 bg-white text-base font-medium text-slate-900 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100">
          <span class="text-xl font-bold" aria-hidden="true"><span class="text-blue-500">G</span></span>
          Continue with Google
        </a>
      </section>
    </main>

    <script>
      const password = document.getElementById("password");
      const toggle = document.getElementById("toggle-password");
      toggle.addEventListener("click", () => {
        const visible = password.type === "text";
        password.type = visible ? "password" : "text";
        toggle.setAttribute("aria-label", visible ? "Show password" : "Hide password");
      });
    </script>
  </body>
</html>
