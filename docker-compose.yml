services:
  localstack:
    # pinned: the `latest`/2026.x images require a license token since 2026;
    # 4.14.0 is the newest community edition (matches ai-act-platform)
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: ssm,dynamodb
      DEFAULT_REGION: eu-central-1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"dynamodb\": \"available\"'"]
      interval: 5s
      timeout: 5s
      retries: 24

  user-service:
    # Mock of the upstream user microservice, driven by declarative WireMock
    # mappings (mocks/user-service/mappings/). Keeps the same endpoints and
    # semantics as the former inline Python stub without custom code.
    image: wiremock/wiremock:3.13.2-alpine
    volumes:
      - ./mocks/user-service/mappings:/home/wiremock/mappings:ro
    command: --port 9000
    healthcheck:
      # 127.0.0.1, not localhost — busybox wget resolves localhost to ::1,
      # where WireMock (IPv4-only) does not listen.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24

  app:
    build: .
    # The runtime image intentionally excludes dev dependencies (the Lambda
    # layer provides boto3 in production); sync the full lock here so the app
    # and the seed script can talk to LocalStack.
    command: >
      sh -c "uv sync --frozen &&
             uv run uvicorn app.api_handler:app --host 0.0.0.0 --port 8080"
    environment:
      APP_NAME: auth-service
      STAGE: local
      DEFAULT_TIMEZONE: UTC
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-central-1
      AWS_ENDPOINT_URL: http://localstack:4566
      CLIENT_SECRET_SSM_PARAM_NAME: /local/auth-service/client-secret
      JWT_SECRET_SSM_PARAM_NAME: /local/secrets/jwt-secret
      USER_SERVICE_BASE_URL_SSM_PARAM_NAME: /local/user-service/base-url
    depends_on:
      localstack:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
