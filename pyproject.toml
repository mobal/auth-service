[project]
name = "auth-service"
version = "0.8.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.42.45",
    "boto3-stubs>=1.42.48",
    "fastapi>=0.128.6",
    "httpx>=0.28.1",
    "mangum>=0.21.0",
    "pendulum>=3.2.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.11.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.40.0",
    "python-multipart>=0.0.27",
]

[dependency-groups]
dev = [
    "aws-lambda-powertools[validation]>=3.24.0",
    "bandit>=1.9.3",
    "moto>=5.1.21",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "pytest-mock>=3.15.1",
    "pytest-httpx>=0.34.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.0",
    "time-machine>=3.2.0",
    "ty>=0.0.15",
]

[tool.pytest.ini_options]
addopts = "--cache-clear --cov-branch --cov-report term --cov=app/ -n 4 -r f"
env = [
    "APP_NAME=auth-service",
    "AWS_ACCESS_KEY_ID=access_key_id",
    "AWS_DEFAULT_REGION=eu-central-1",
    "AWS_SECRET_ACCESS_KEY=secret_access_key",
    "CLIENT_SECRET_SSM_PARAM_NAME=/dev/auth-service/client-secret",
    "CLIENT_SECRET_SSM_PARAM_VALUE=9f4a2c8e1b7d0f3a6e5c9b2a4d7f0e1c3f8a9c7e2b1d0f5a6e4c8b9a2d7f0e1c",
    "DEBUG=true",
    "DEFAULT_TIMEZONE=UTC",
    "JWT_SECRET_SSM_PARAM_NAME=/dev/secrets/secret",
    "JWT_SECRET_SSM_PARAM_VALUE=9f4a2c8e1b7d0f3a6e5c9b2a4d7f0e1c3f8a9c7e2b1d0f5a6e4c8b9a2d7f0e1c",
    "JWT_TOKEN_LIFETIME=3600",
    "LOG_LEVEL=INFO",
    "POWERTOOLS_LOGGER_LOG_EVENT=true",
    "POWERTOOLS_SERVICE_NAME=auth-service",
    "POWERTOOLS_DEBUG=false",
    "REFRESH_TOKEN_LIFETIME=3600",
    "SERVICE_TOKEN_LIFETIME=30",
    "STAGE=test",
    "USER_SERVICE_BASE_URL_SSM_PARAM_NAME=/dev/user-service/base-url",
    "USER_SERVICE_BASE_URL_SSM_PARAM_VALUE=http://user-service",
]
pythonpath = [
    ".",
    "app",
]
testpaths = [
    "tests"
]
